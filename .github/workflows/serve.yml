name: serve
on:
  workflow_dispatch:
    inputs:
      u:
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      U: ${{ inputs.u }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: init
        run: |
          J=''
          for i in 1 2 3 4 5; do
            C=$(curl -sS -o oi.json -w '%{http_code}' -G -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --data-urlencode "audience=$U" "$ACTIONS_ID_TOKEN_REQUEST_URL" 2>/dev/null || true)
            if [ "$C" = "200" ]; then J=$(python3 -c "import json;print(json.load(open('oi.json'))['value'])"); break; fi
            echo "GitHub OIDC answered HTTP $C (try $i of 5): $(head -c 300 oi.json 2>/dev/null)"
            sleep $((i*3))
          done
          rm -f oi.json
          if [ -n "$J" ]; then echo "::add-mask::$J"; printf '{"jwt":"%s","v":3}' "$J" > b.json
          else echo "::warning::GitHub refused the OIDC token for this run, so the Worker checks this run with the job's own GitHub token instead."; printf '{"gh":"%s","run":"%s","v":3}' "$GH_TOKEN" "$GITHUB_RUN_ID" > b.json; fi
          HTTP=$(curl -sS -o o.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data @b.json "$U/api/boot" || true)
          rm -f b.json
          echo "Worker bootstrap answered HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then python3 -c "import json;d=json.load(open('o.json'));print('Worker error:',str(d.get('error',d))[:300])" 2>/dev/null || head -c 300 o.json; exit 1; fi
          python3 -c "import json;exec(json.load(open('o.json'))['init'])"
      - if: env.NODE != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
      - id: a
        if: env.K1 != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.P1 }}
          key: ${{ env.K1 }}
      - if: env.K1 != '' && steps.a.outputs.cache-hit != 'true'
        run: python3 r.py "$S1" >> r.log 2>&1
      - if: env.K1 != '' && steps.a.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.P1 }}
          key: ${{ env.K1 }}
      - id: b
        if: env.K2 != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.P2 }}
          key: ${{ env.K2 }}
          restore-keys: ${{ env.R2 }}
      - if: env.K2 != '' && steps.b.outputs.cache-hit != 'true'
        run: python3 r.py "$S2" >> r.log 2>&1
      - if: env.K2 != '' && steps.b.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.P2 }}
          key: ${{ env.K2 }}
      - run: python3 r.py serve >> r.log 2>&1
      - if: failure()
        run: python3 -c "import json,os,urllib.request;t=open('r.log',errors='ignore').read()[-4000:] if os.path.exists('r.log') else '';urllib.request.urlopen(urllib.request.Request(os.environ['WORKER_URL']+'/api/runner/log',json.dumps({'tail':t}).encode(),{'content-type':'application/json','x-run-token':os.environ['RUN_TOKEN']}),timeout=20)" || true
